<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e0e5ec">
<title>Loopereel</title>
<style>
:root{
--bg:#e0e5ec;
--fg:#3d4852;
--muted:#6b7280;
--card:#e0e5ec;
--shadow-dark:#a3b1c6;
--shadow-light:#ffffff;
--accent:#F97316;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:radial-gradient(1200px 800px at 30% 20%,#f3f6fb 0%,var(--bg) 55%);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
body{position:fixed;inset:0;display:grid;place-items:center}
.canvas{width:min(96vw,1180px);height:min(96vh,760px);border-radius:40px;background:var(--card);box-shadow:22px 22px 44px var(--shadow-dark),-22px -22px 44px var(--shadow-light);display:grid;grid-template-columns:1fr auto;gap:18px;padding:22px;align-items:center}
.phone-wrap{display:grid;place-items:center;height:100%}
.phone{position:relative;aspect-ratio:9/16;height:min(100%,680px);width:auto;max-width:100%;border-radius:34px;overflow:hidden;background:#000;box-shadow:inset 10px 10px 22px rgba(0,0,0,.35),inset -8px -8px 18px rgba(255,255,255,.08),14px 14px 30px var(--shadow-dark),-14px -14px 30px var(--shadow-light)}
#clip{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.grad{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.35) 0,transparent 24%,transparent 60%,rgba(0,0,0,.78) 100%)}
.topbar{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:3;pointer-events:none;color:#fff}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;opacity:.92}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.status{font-size:11px;opacity:.75}
.bottom{position:absolute;left:14px;right:74px;bottom:16px;z-index:3;pointer-events:none;color:#fff}
.handle{font-weight:700;font-size:14px;margin-bottom:3px;display:flex;align-items:center;gap:7px}
.verified{width:14px;height:14px;border-radius:50%;background:#3b82f6;display:grid;place-items:center;font-size:9px}
.caption{font-size:12px;line-height:1.35;opacity:.92;margin-bottom:6px}
.soundline{display:flex;align-items:center;gap:7px;font-size:11px;opacity:.8}
.disc{width:13px;height:13px;border-radius:50%;background:var(--accent);animation:spin 6s linear infinite}
.actions{position:absolute;right:10px;bottom:20px;display:flex;flex-direction:column;align-items:center;gap:16px;z-index:3;pointer-events:none}
.action{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;cursor:pointer}
.circle{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.circle svg{width:20px;height:20px;fill:currentColor}
.label{font-size:10px;font-weight:600}
.side{display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;padding:8px}
.nbtn{width:58px;height:58px;border-radius:50%;border:none;background:var(--card);color:var(--fg);display:grid;place-items:center;cursor:pointer;box-shadow:8px 8px 16px var(--shadow-dark),-8px -8px 16px var(--shadow-light);transition:all .15s ease}
.nbtn:active{box-shadow:inset 6px 6px 12px var(--shadow-dark),inset -6px -6px 12px var(--shadow-light)}
.nbtn svg{width:22px;height:22px;fill:currentColor}
.ncount{font-size:11px;font-weight:700;color:var(--muted)}
.nlabel{font-size:10px;color:var(--muted)}
.toolbar{grid-column:1/-1;display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap}
.tbtn{border:none;border-radius:16px;padding:10px 16px;background:var(--card);color:var(--fg);font-weight:600;font-size:12px;cursor:pointer;box-shadow:6px 6px 12px var(--shadow-dark),-6px -6px 12px var(--shadow-light);display:flex;align-items:center;gap:8px}
.tbtn:active{box-shadow:inset 5px 5px 10px var(--shadow-dark),inset -5px -5px 10px var(--shadow-light)}
.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;background:rgba(255,255,255,.7);color:var(--fg);border-radius:16px;padding:12px 16px;text-align:center;box-shadow:8px 8px 16px var(--shadow-dark),-8px -8px 16px var(--shadow-light);transition:opacity .4s}
.hint h2{font-size:15px;margin-bottom:3px}
.hint p{font-size:11px;opacity:.75}
.hint.hide{opacity:0}
.loader{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(224,229,236,.75);backdrop-filter:blur(4px);font-size:13px;font-weight:700;color:var(--fg)}
.loader.hide{display:none}
.progress{width:70%;height:8px;border-radius:999px;background:var(--card);box-shadow:inset 4px 4px 8px var(--shadow-dark),inset -4px -4px 8px var(--shadow-light);overflow:hidden;margin-top:10px}
.bar{height:100%;width:0%;background:var(--accent);border-radius:999px;transition:width .15s}
#ckpt{position:fixed;right:12px;bottom:calc(12px+env(safe-area-inset-bottom));background:#F97316;color:#1A0F02;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.4;padding:6px 10px;border-radius:6px;z-index:9999;max-width:min(70vw,420px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.9;pointer-events:auto;cursor:default;box-shadow:4px 4px 8px #a3b1c6,-4px -4px 8px #ffffff}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:820px){.canvas{grid-template-columns:1fr;grid-template-rows:auto auto;}.side{flex-direction:row;flex-wrap:wrap}}
</style>
</head>
<body>
<div class="canvas">
  <div class="phone-wrap">
    <div class="phone">
      <video id="clip" loop playsinline preload="auto"></video>
      <div class="grad"></div>
      <div class="topbar"><div class="brand"><span class="dot"></span>Loopereel</div><div class="status" id="status">Loading clip…</div></div>
      <div class="actions">
        <div class="action"><div class="circle"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.3-8.3C.7 9.4 3 5 7 5c2.2 0 3.6 1.2 5 3 1.4-1.8 2.8-3 5-3 4 0 6.3 4.4 4.3 7.7C19 16.4 12 21 12 21z"/></svg></div><div class="label">124K</div></div>
        <div class="action"><div class="circle"><svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg></div><div class="label">892</div></div>
        <div class="action"><div class="circle"><svg viewBox="0 0 24 24"><path d="M18 16a3 3 0 0 0-2.4 1.3l-7.1-3.5a3 3 0 0 0 0-1.6l7.1-3.5A3 3 0 1 0 15 6a3 3 0 0 0 .2 1.1L8.1 10.6a3 3 0 1 0 0 2.8l7.1 3.5A3 3 0 1 0 18 16z"/></svg></div><div class="label">Share</div></div>
        <div class="action"><div class="circle"><svg viewBox="0 0 24 24"><path d="M6 3h12a2 2 0 0 1 2 2v16l-7-4-7 4V5a2 2 0 0 1 2-2z"/></svg></div><div class="label">Save</div></div>
      </div>
      <div class="bottom">
        <div class="handle">@loopereel <span class="verified">✓</span></div>
        <div class="caption">Comp 1 • 10s clip. Loops automatically. Original audio.</div>
        <div class="soundline"><span class="disc"></span>Original sound — @loopereel</div>
      </div>
      <div class="hint" id="hint"><h2>Tap to unmute</h2><p>Browser may block autoplay audio</p></div>
      <div class="loader" id="loader"><div><div>Loading clip</div><div class="progress"><div class="bar" id="bar"></div></div></div></div>
    </div>
  </div>
  <div class="side">
    <button class="nbtn" id="playBtn" title="Play / Pause"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    <span class="ncount" id="playCount">Play</span>
    <button class="nbtn" id="muteBtn" title="Mute"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
    <span class="ncount" id="muteLabel">Sound</span>
    <button class="nbtn" id="loopBtn" title="Loop"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H6a4 4 0 0 0-4 4v2h2V9a2 2 0 0 1 2-2zm10 10H7v-3l-4 4 4 4v-3h11a4 4 0 0 0 4-4v-2h-2v2a2 2 0 0 1-2 2z"/></svg></button>
    <span class="ncount">Loop</span>
    <button class="nbtn" id="saveBtn" title="Download clip"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg></button>
    <span class="ncount">Save</span>
  </div>
  <div class="toolbar">
    <button class="tbtn" id="downloadLink">Download clip.mp4</button>
    <button class="tbtn" id="reloadBtn">Reload clip</button>
    <span id="dbg" style="font-size:11px;color:var(--muted)"></span>
  </div>
</div>
<div id="ckpt" title="v0.3.0 neuromorphic canvas, local clip, loop, audio">#ckpt-loopereel-"v0.3.0 • neuromorphic canvas, local clip, loop, audio"</div>
<script>
const video=document.getElementById("clip");
const loader=document.getElementById("loader");
const bar=document.getElementById("bar");
const status=document.getElementById("status");
const hint=document.getElementById("hint");
const dbg=document.getElementById("dbg");

video.loop=true;
video.autoplay=true;
video.playsInline=true;
video.muted=false;

let objectUrl=null;
async function loadClip(){
  loader.classList.remove("hide");
  status.textContent="Downloading clip…";
  try{
    const res=await fetch("clip.mp4");
    if(!res.ok) throw new Error(res.status);
    const total=Number(res.headers.get("content-length")||0);
    const reader=res.body.getReader();
    const chunks=[];
    let received=0;
    while(true){
      const {done,value}=await reader.read();
      if(done) break;
      chunks.push(value);
      received += value.length;
      if(total) bar.style.width=Math.round(received/total*100)+"%";
    }
    const blob=new Blob(chunks,{type:"video/mp4"});
    if(objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl=URL.createObjectURL(blob);
    video.src=objectUrl;
    video.load();
    await tryPlay(false);
    status.textContent="Looping";
  } catch(e){
    console.error(e);
    video.src="clip.mp4";
    video.load();
    await tryPlay(false);
    status.textContent="Looping";
    dbg.textContent="fallback direct";
  } finally {
    loader.classList.add("hide");
  }
}

async function tryPlay(muted=video.muted){
  video.muted=muted;
  try{
    await video.play();
    hint.classList.add("hide");
    document.getElementById("muteLabel").textContent=video.muted?"Muted":"Sound";
    return true;
  } catch(e){
    hint.classList.remove("hide");
    return false;
  }
}

video.addEventListener("loadedmetadata",()=>{ tryPlay(false); });
video.addEventListener("error",e=>{ status.textContent="Clip error"; dbg.textContent=video.error&&video.error.message; });

document.getElementById("playBtn").addEventListener("click",async()=>{ if(video.paused) await tryPlay(video.muted); else video.pause(); });
document.getElementById("muteBtn").addEventListener("click",async()=>{ video.muted=!video.muted; document.getElementById("muteLabel").textContent=video.muted?"Muted":"Sound"; await tryPlay(video.muted); });
document.getElementById("loopBtn").addEventListener("click",()=>{ video.loop=!video.loop; dbg.textContent=video.loop?"loop on":"loop off"; });
document.getElementById("saveBtn").addEventListener("click",()=>{ const a=document.createElement("a"); a.href="clip.mp4"; a.download="clip.mp4"; a.click(); });
document.getElementById("downloadLink").addEventListener("click",()=>{ const a=document.createElement("a"); a.href="clip.mp4"; a.download="clip.mp4"; a.click(); });
document.getElementById("reloadBtn").addEventListener("click",()=>loadClip());

setTimeout(()=>hint.classList.add("hide"),5000);
window.addEventListener("click",()=>{ if(video.paused) tryPlay(false); }, {once:true});

loadClip();
</script>
</body>
</html>
